# Set by the Service Images workflow of withhuman-core.
imageTag: 47d9ef37531016b7582dde0ab6084b0bd4564710

collector:
  mode: shadow

externalSecret:
  enabled: true
  data:
    - secretKey: database-url
      remoteRef: { key: withhuman-staging/database-url }
    - secretKey: redis-url
      remoteRef: { key: withhuman-staging/engine, property: redis-url }
    - secretKey: jev-api-key
      remoteRef: { key: withhuman-staging/jev-api-key }

# Off until this environment has a domain: `host` is required once enabled, and cert-manager issues
# the certificate for that name. Reach the gateway with `kubectl port-forward` meanwhile.
ingress:
  enabled: false
  className: traefik
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tlsSecretName: withhuman-tls
