# Promote by copying a tag that passed staging.
imageTag: ""

# Fill in when the production environment exists.
neo4j:
  httpUrl: ""
  boltUrl: ""

# Move to `enforce` once shadow results and a sustained load test pass.
collector:
  mode: shadow

externalSecret:
  enabled: true
  data:
    - secretKey: neo4j-password
      remoteRef: { key: withhuman-prod/engine, property: neo4j-password }
    - secretKey: redis-url
      remoteRef: { key: withhuman-prod/engine, property: redis-url }
    - secretKey: jev-api-key
      remoteRef: { key: withhuman-prod/jev-api-key }

ingress:
  enabled: true
  className: traefik
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tlsSecretName: withhuman-tls
