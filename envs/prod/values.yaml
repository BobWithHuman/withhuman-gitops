# Promote by copying a tag that passed staging.
imageTag: ""

# Move to `enforce` once shadow results and a sustained load test pass.
collector:
  mode: shadow

externalSecret:
  enabled: true
  data:
    - secretKey: database-url
      remoteRef: { key: withhuman-prod/database-url }
    - secretKey: redis-url
      remoteRef: { key: withhuman-prod/engine, property: redis-url }
    - secretKey: jev-api-key
      remoteRef: { key: withhuman-prod/jev-api-key }

# Off until this environment has a domain: `host` is required once enabled, and cert-manager issues
# the certificate for that name.
ingress:
  enabled: false
  className: traefik
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tlsSecretName: withhuman-tls
