apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: withhuman-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/BobWithHuman/withhuman-core.git
      targetRevision: 47d9ef37531016b7582dde0ab6084b0bd4564710
      path: deploy/k8s/withhuman
      helm:
        releaseName: withhuman
        valueFiles:
          - $values/envs/staging/values.yaml
    - repoURL: https://github.com/BobWithHuman/withhuman-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: withhuman-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
